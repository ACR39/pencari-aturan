name: Proses PDF menjadi indeks

on:
  push:
    paths:
      - "pdf/**"
      - "scripts/**"
      - "pecah.py"
  workflow_dispatch:
    inputs:
      semua:
        description: "Proses ulang semua PDF (bukan hanya yang baru)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: proses-pdf
  cancel-in-progress: false

jobs:
  proses:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pasang poppler dan tesseract (OCR bahasa Indonesia)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-ind tesseract-ocr-eng

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Proses PDF
        run: |
          if [ "${{ inputs.semua }}" = "true" ]; then python scripts/proses_pdf.py --semua; else python scripts/proses_pdf.py; fi
          cat data/laporan.md >> "$GITHUB_STEP_SUMMARY"

      - name: Simpan indeks ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan indeks."
          else
            git commit -m "Perbarui indeks pencarian dari PDF"
            git push
          fi
